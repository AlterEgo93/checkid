<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перевірка статусу заявки</title>

<style>
body {
    font-family: Arial;
    background: #0f0f0f;
    color: #fff;
    text-align: center;
    padding: 20px;
}

input {
    padding: 12px;
    width: 200px;
    margin: 10px;
}

button {
    padding: 12px;
    background: #d4af37;
    border: none;
}

.result {
    margin-top: 20px;
}
</style>
</head>

<body>

<h2>Перевірка статусу</h2>

<input id="id" placeholder="Введіть ID (e86)">
<br>
<button onclick="check()">Перевірити</button>

<div class="result" id="result"></div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbyN8r_nDF-b9U8ljwFiWkYcZlxwwY2kH7ojPtlzV5YQnza_zkybzOvNIbHYCvxVFs7iHQ/exec";

function check() {
    const id = document.getElementById("id").value.trim();

    fetch(`${scriptURL}?id=${id}`)
        .then(res => res.json())
        .then(data => {
            if (data.status === "not_found") {
                result.innerHTML = "Не знайдено";
                return;
            }

            result.innerHTML = `
                <p>ID: ${data.data.id}</p>
                <p>Підрозділ: ${data.data.unit}</p>
                <p>Позиція: ${data.data.position}</p>
                <p>Що веземо: ${data.data.cargo}</p>
                <p><b>Статус: ${data.data.statusText}</b></p>
            `;
        });
}
</script>

</body>
</html>
