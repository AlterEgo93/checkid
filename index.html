<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перевірка статусу заявки</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
}

.header {
    padding: 15px;
    background: #1a1a1a;
    font-size: 20px;
    font-weight: bold;
}

.container {
    padding: 20px;
    text-align: center;
}

input {
    width: 80%;
    max-width: 250px;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 16px;
}

button {
    margin-top: 10px;
    width: 80%;
    max-width: 250px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #d4af37;
    color: #000;
    font-weight: bold;
    font-size: 16px;
}

.result {
    margin-top: 20px;
    text-align: left;
}

.status {
    margin-top: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
    Перевірка статусу
</div>

<div class="container">

<form onsubmit="check(); return false;">
    <input id="id" placeholder="Введіть ID заявки">
    <br>
    <button type="submit">Перевірити</button>
</form>

<div class="result" id="result"></div>

</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbyN8r_nDF-b9U8ljwFiWkYcZlxwwY2kH7ojPtlzV5YQnza_zkybzOvNIbHYCvxVFs7iHQ/exec"; // встав сюди Apps Script URL

// автофокус
window.onload = () => {
    document.getElementById("id").focus();
};

function normalize(input) {
    return input.trim().toLowerCase();
}

function check() {
    const raw = document.getElementById("id").value;
    const id = normalize(raw);

    if (!id) return;

    fetch(`${scriptURL}?id=${id}`)
        .then(res => res.json())
        .then(data => {
            if (data.status === "not_found") {
                result.innerHTML = "<p>❌ Не знайдено</p>";
                return;
            }

            result.innerHTML = `
                <p>ID: ${data.data.id}</p>
                <p>Підрозділ: ${data.data.unit}</p>
                <p>Позиція: ${data.data.position}</p>
                <p>Що веземо: ${data.data.cargo}</p>
                <p class="status">Статус: ${data.data.statusText}</p>
            `;
        })
        .catch(() => {
            result.innerHTML = "<p>⚠️ Помилка запиту</p>";
        });
}
</script>

</body>
</html>
