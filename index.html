<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перевірка статусу заявки</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        /* Шапка з використанням Flexbox для вирівнювання */
        .header {
            padding: 15px 20px;
            background: #1a1a1a;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center; /* Центрує лого і текст по вертикалі */
            gap: 15px;           /* Відстань між лого і текстом */
        }

        /* Стиль для посилання, щоб прибрати підкреслення */
        .logo-link {
            text-decoration: none;
            display: flex;
            align-items: center;
            border: none;
            outline: none;
        }

        .logo-img {
            height: 28px;       /* Розмір логотипу */
            display: block;
        }
            
        .container {
            padding: 20px;
            text-align: center;
        }

        input {
            width: 80%;
            max-width: 250px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        button {
            margin-top: 15px;
            width: 80%;
            max-width: 250px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #d4af37;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #f1c40f;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            text-align: left;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }

        .status {
            margin-top: 10px;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
        }

        /* Кольори статусів */
        .green { background: #1f7a1f; }
        .yellow { background: #8a6d00; }
        .red { background: #8b1e1e; }
        .gray { background: #444; }

        /* Loader */
        .loader {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .hidden { display: none; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="header">
    <a href="https://AlterEgo93.github.io" class="logo-link">
        <img src="https://i.ibb.co/R1Z4HdW/1776440599195-2.jpg" class="logo-img" alt="Логотип">
    </a>
    <span>Перевірка статусу</span>
</div>

<div class="container">
    <form onsubmit="check(); return false;">
        <input id="id" placeholder="Введіть ID заявки" autocomplete="off">
        <br>
        <button id="btn" type="submit">Перевірити</button>
    </form>

    <div id="loader" class="loader hidden"></div>
    <div class="result" id="result"></div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbyN8r_nDF-b9U8ljwFiWkYcZlxwwY2kH7ojPtlzV5YQnza_zkybzOvNIbHYCvxVFs7iHQ/exec";

window.onload = () => {
    document.getElementById("id").focus();
};

function normalize(input) {
    return input.trim().toLowerCase();
}

function getStatusClass(status) {
    const s = status.toLowerCase();
    if (s.includes("викон") || s.includes("done") || s.includes("complete")) return "green";
    if (s.includes("робот") || s.includes("pending") || s.includes("process")) return "yellow";
    if (s.includes("відм") || s.includes("скас") || s.includes("reject")) return "red";
    return "gray";
}

function check() {
    const input = document.getElementById("id");
    const btn = document.getElementById("btn");
    const loader = document.getElementById("loader");
    const result = document.getElementById("result");

    const id = normalize(input.value);
    if (!id) return;

    result.innerHTML = "";
    loader.classList.remove("hidden");
    btn.disabled = true;

    fetch(`${scriptURL}?id=${id}`)
        .then(res => res.json())
        .then(data => {
            loader.classList.add("hidden");
            btn.disabled = false;

            if (data.status === "not_found") {
                result.innerHTML = "<p style='text-align:center;'>❌ Не знайдено</p>";
                return;
            }

            const statusText = data.data.statusText || "Немає статусу";
            const statusClass = getStatusClass(statusText);

            result.innerHTML = `
                <p><b>ID:</b> ${data.data.id.slice(-3)}</p>
                <p><b>Підрозділ:</b> ${data.data.unit}</p>
                <p><b>Позиція:</b> ${data.data.position}</p>
                <p><b>Що веземо:</b> ${data.data.cargo}</p>
                <p class="status ${statusClass}"><b>Статус:</b> ${statusText}</p>
            `;
        })
        .catch(() => {
            loader.classList.add("hidden");
            btn.disabled = false;
            result.innerHTML = "<p style='text-align:center;'>⚠️ Помилка запиту</p>";
        });
}
</script>

</body>
</html>
